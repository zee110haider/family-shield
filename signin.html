<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Shield — Sign in</title>
<style>
body{font-family:system-ui,Roboto,sans-serif;background:#F4F6F8;color:#263238;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{background:#fff;border-radius:18px;padding:36px 32px;max-width:420px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{font-size:24px;margin:8px 0}p{color:#607D8B}
button{background:#1565C0;color:#fff;border:0;border-radius:28px;padding:14px 26px;font-size:16px;cursor:pointer;margin-top:12px}
</style></head>
<body><div class="card">
<div style="font-size:56px">🛡️</div>
<h1>Family Shield for Windows</h1>
<p id="msg">Sign in with the same Google account you use on your parent phone.</p>
<button id="go">Sign in with Google</button>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
const app = initializeApp({
  apiKey: "AIzaSyDPJx02ofq53H1qSK90ayKUq-ubfoWlUqE",
  authDomain: "family-shield-291f6.firebaseapp.com",
  projectId: "family-shield-291f6",
  appId: "1:564912015399:web:1c2ed5c4a8ccf4a9fb6602"
});
const q = new URLSearchParams(location.search);
const port = parseInt(q.get("port") || "0", 10), state = q.get("state") || "";
const msg = document.getElementById("msg"), btn = document.getElementById("go");
if (!(port > 1024 && port < 65536) || !/^[a-z0-9]{16,64}$/i.test(state)) {
  msg.textContent = "Open this page from the Family Shield Windows app."; btn.style.display = "none";
}
btn.onclick = async () => {
  try {
    const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" });
    const res = await signInWithPopup(getAuth(app), p);
    const cred = GoogleAuthProvider.credentialFromResult(res);
    msg.textContent = "Signed in ✅ Returning to the app…"; btn.style.display = "none";
    location.href = "http://127.0.0.1:" + port + "/cb?state=" + encodeURIComponent(state) + "#id_token=" + encodeURIComponent(cred.idToken);
  } catch (e) { msg.textContent = "Sign-in failed: " + (e.code || e.message); }
};
</script>
</body></html>
